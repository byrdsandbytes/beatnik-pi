name: Publish beatnik-repo.json

# Runs once a release is actually published (not on draft creation), so the download
# link in beatnik-repo.json is never live before the asset itself is public.
#
# Can also be run manually for an already-published release (e.g. to backfill one
# where this workflow failed).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  pull-requests: write

# Never let two runs race each other pushing to master.
concurrency:
  group: publish-repo-json
  cancel-in-progress: false

jobs:
  update-repo-json:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Always check out master: for release events GitHub would otherwise check out
      # the tag, which we can't push back to master from.
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Check release state
        id: state
        run: |
          read -r IS_DRAFT IS_PRERELEASE < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "::error::Release $TAG is still a draft - publish it first."
            exit 1
          fi
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "::notice::Release $TAG is a prerelease - beatnik-repo.json is left untouched."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build metadata
        if: steps.state.outputs.skip != 'true'
        run: |
          # Fallback name: releases built before this refactor used <img>.meta.json.
          for NAME in "beatnik-os-${TAG}.meta.json" "beatnik-os-${TAG}.img.meta.json"; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern "$NAME" --output meta.json --clobber 2>/dev/null; then
              echo "Using $NAME"
              cat meta.json
              exit 0
            fi
          done
          echo "::error::No build metadata asset found on release $TAG"
          exit 1

      - name: Update beatnik-repo.json
        if: steps.state.outputs.skip != 'true'
        run: python3 ci/update_repo_json.py --meta meta.json

      # master is protected, so open a PR instead of pushing directly.
      # Requires: Settings → Actions → General → "Allow GitHub Actions to create and
      # approve pull requests".
      - name: Open pull request
        if: steps.state.outputs.skip != 'true'
        run: |
          if git diff --quiet -- beatnik-repo.json; then
            echo "beatnik-repo.json already up to date."
            exit 0
          fi
          BRANCH="chore/repo-json-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add beatnik-repo.json
          git commit -m "chore: add ${TAG} to beatnik-repo.json"
          # --force so re-running for the same tag just refreshes the existing PR.
          git push --force origin "$BRANCH"

          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            echo "PR for $BRANCH already open - branch updated."
          else
            gh pr create --base master --head "$BRANCH" \
              --title "chore: add ${TAG} to beatnik-repo.json" \
              --body "Adds Beatnik OS ${TAG} to \`beatnik-repo.json\` so Raspberry Pi Imager offers it. Generated from the \`beatnik-os-${TAG}.meta.json\` asset of the published release."
          fi
