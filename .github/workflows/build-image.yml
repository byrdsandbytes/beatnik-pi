name: Build Beatnik OS Image

# Two ways to run this, and only one of them makes a release:
#
#   push a tag v*.*.*   -> builds the image and creates a DRAFT GitHub release.
#                          Publishing that draft triggers publish-repo-json.yml.
#   Run workflow (UI)   -> test build only: the image is uploaded as a workflow
#                          artifact. Never creates or touches a release.
#
# See docs/advanced/releasing.md.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label for the test image file name (optional, defaults to test-<commit>)"
        required: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Two builds for the same tag must never run at the same time.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-image:
    # Pinned: newer ubuntu-latest no longer ships a installable qemu-user-static
    # package, which pguyot/arm-runner-action installs.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and release flags
        id: ver
        env:
          LABEL: ${{ inputs.label }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "release=true" >> "$GITHUB_OUTPUT"
            # semver pre-release suffix, e.g. v1.0.0-rc1 or v1.0.0-beta.2
            if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            VERSION="${LABEL:-test-${GITHUB_SHA::7}}"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Fail fast instead of spending 15 minutes on a build we are not allowed to upload.
      - name: Refuse to overwrite a published release
        if: steps.ver.outputs.release == 'true'
        run: ci/assert_release_not_published.sh "${{ steps.ver.outputs.version }}"

      # Mitigates transient "Cannot allocate memory" apt errors seen under QEMU emulation.
      # Uses a distinct filename since ubuntu-latest runners already ship an active
      # /swapfile - reusing that path fails with "fallocate: Text file busy".
      - name: Add swap space
        run: |
          sudo fallocate -l 4G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      - name: Build Raspberry Pi OS image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          # Pinned to Bookworm (Legacy track); raspios_lite_arm64:latest now resolves to Trixie.
          base_image: https://downloads.raspberrypi.com/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2026-09-15/2026-09-15-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a53
          image_additional_mb: 3000
          commands: |
            chmod +x ci/provision.sh ci/firstboot.sh
            ./ci/provision.sh

      - name: Install xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Rename image
        id: rename
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          IMG="beatnik-os-${VERSION}.img"
          mv "${{ steps.build_image.outputs.image }}" "$IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Checksum uncompressed image
        id: raw
        run: |
          IMG="${{ steps.rename.outputs.img }}"
          echo "sha256=$(sha256sum "$IMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$IMG")" >> "$GITHUB_OUTPUT"

      - name: Compress image
        run: xz -z -9 -T 0 -v "${{ steps.rename.outputs.img }}"

      - name: Checksum compressed image
        id: xz
        run: |
          XZFILE="${{ steps.rename.outputs.img }}.xz"
          echo "file=$XZFILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$XZFILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$XZFILE")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (test runs)
        if: steps.ver.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.img }}.xz
          path: ${{ steps.xz.outputs.file }}
          retention-days: 7

      # Consumed by publish-repo-json.yml once the release is actually published,
      # so beatnik-repo.json is never updated before the asset is publicly downloadable.
      # The name MUST stay beatnik-os-<version>.meta.json - publish-repo-json.yml
      # downloads it by exactly that name.
      - name: Write build metadata
        id: meta
        run: |
          META_FILE="beatnik-os-${{ steps.ver.outputs.version }}.meta.json"
          jq -n \
            --arg version    "${{ steps.ver.outputs.version }}" \
            --argjson img_size "${{ steps.raw.outputs.size }}" \
            --arg img_sha256 "${{ steps.raw.outputs.sha256 }}" \
            --argjson xz_size  "${{ steps.xz.outputs.size }}" \
            --arg xz_sha256  "${{ steps.xz.outputs.sha256 }}" \
            '{version: $version, img_size: $img_size, img_sha256: $img_sha256, xz_size: $xz_size, xz_sha256: $xz_sha256}' \
            > "$META_FILE"
          cat "$META_FILE"
          echo "file=$META_FILE" >> "$GITHUB_OUTPUT"

      # Checked again: someone may have published the draft while this build ran.
      - name: Re-check release is still unpublished
        if: steps.ver.outputs.release == 'true'
        run: ci/assert_release_not_published.sh "${{ steps.ver.outputs.version }}"

      - name: Create GitHub release (draft)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Beatnik OS ${{ steps.ver.outputs.version }}"
          files: |
            ${{ steps.xz.outputs.file }}
            ${{ steps.meta.outputs.file }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}

      # Preview only - not committed here. beatnik-repo.json is only committed by
      # publish-repo-json.yml once you actually click "Publish release" on GitHub.
      - name: Update beatnik-repo.json (preview)
        run: python3 ci/update_repo_json.py --meta "${{ steps.meta.outputs.file }}"

      - name: Upload beatnik-repo.json preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: beatnik-repo-preview
          path: |
            beatnik-repo.json
            ${{ steps.meta.outputs.file }}
          retention-days: 7
