name: Build Beatnik OS Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, e.g. v1.0.0"
        required: true
      publish:
        description: "Create a real release and commit beatnik-repo.json"
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version, publish and prerelease flags
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # semver pre-release suffix, e.g. v1.0.0-rc1 or v1.0.0-beta.2
            if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ github.event.inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Raspberry Pi OS image
        id: build_image
        uses: pguyot/arm-runner-action@v2
        with:
          # Pinned to Bookworm (Legacy track); raspios_lite_arm64:latest now resolves to Trixie.
          base_image: https://downloads.raspberrypi.com/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2026-09-15/2026-09-15-raspios-bookworm-arm64-lite.img.xz
          cpu: cortex-a53
          image_additional_mb: 3000
          commands: |
            chmod +x ci/provision.sh ci/firstboot.sh
            ./ci/provision.sh

      - name: Install xz
        run: sudo apt-get update && sudo apt-get install -y xz-utils

      - name: Rename image
        id: rename
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          IMG="beatnik-os-${VERSION}.img"
          mv "${{ steps.build_image.outputs.image }}" "$IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"

      - name: Checksum uncompressed image
        id: raw
        run: |
          IMG="${{ steps.rename.outputs.img }}"
          echo "sha256=$(sha256sum "$IMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$IMG")" >> "$GITHUB_OUTPUT"

      - name: Compress image
        run: xz -z -9 -T 0 -v "${{ steps.rename.outputs.img }}"

      - name: Checksum compressed image
        id: xz
        run: |
          XZFILE="${{ steps.rename.outputs.img }}.xz"
          echo "file=$XZFILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$XZFILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$XZFILE")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact (test runs)
        if: steps.ver.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.img }}.xz
          path: ${{ steps.xz.outputs.file }}
          retention-days: 7

      # Consumed by publish-repo-json.yml once the release is actually published,
      # so beatnik-repo.json is never updated before the asset is publicly downloadable.
      - name: Write build metadata
        id: meta
        run: |
          META_FILE="${{ steps.rename.outputs.img }}.meta.json"
          cat > "$META_FILE" <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "img_size": ${{ steps.raw.outputs.size }},
            "img_sha256": "${{ steps.raw.outputs.sha256 }}",
            "xz_size": ${{ steps.xz.outputs.size }},
            "xz_sha256": "${{ steps.xz.outputs.sha256 }}"
          }
          EOF
          echo "file=$META_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (draft)
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Beatnik OS ${{ steps.ver.outputs.version }}"
          files: |
            ${{ steps.xz.outputs.file }}
            ${{ steps.meta.outputs.file }}
          draft: true
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}

      # Preview only - not committed here. beatnik-repo.json is only committed by
      # publish-repo-json.yml once you actually click "Publish release" on GitHub.
      - name: Update beatnik-repo.json (preview)
        run: |
          python3 ci/update_repo_json.py \
            --version "${{ steps.ver.outputs.version }}" \
            --xz-size "${{ steps.xz.outputs.size }}" \
            --xz-sha256 "${{ steps.xz.outputs.sha256 }}" \
            --img-size "${{ steps.raw.outputs.size }}" \
            --img-sha256 "${{ steps.raw.outputs.sha256 }}"

      - name: Upload beatnik-repo.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: beatnik-repo.json
          path: beatnik-repo.json
          retention-days: 7
